# Claude answers @claude in issues, pull requests and reviews. It authenticates with
# GitHub OIDC -> Anthropic workload identity federation (rule github-claude-ai), so no
# API key is stored. The action only runs for users with write access to the repository.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_federation_rule_id: fdrl_01N8o8BPi2vhp4aUDhXWSu6b
          anthropic_organization_id: c67ab0b8-c617-40b7-8fa7-2baf2b9a7d41
          anthropic_service_account_id: svac_01SLtCsJSZ6RFnbzm5MNvdyW
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(npm test),Bash(npm run build),Bash(node --check:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh run view:*)"
            --append-system-prompt "You are running in GitHub Actions. The AGENTS.md rules about auto-committing and pushing do not apply here: never push to the default branch, work on a claude/ branch or the PR branch and leave merging to a human. Never print, copy or commit secrets, env file values, signed URLs or HAR files. shortkeys.json, Importurl.txt and preview-trailer.bookmarklet.txt are generated by npm run build: never hand-edit them, regenerate in the same change as any preview-trailer.js or lagacy-preview.js edit. Merging to main changes behaviour for real users because the shortkeys fetch the script from main. lagacy-preview.js is frozen. Never log full signed URLs and keep window.open synchronous from the user action. The repository is public: never commit logs, HAR files or media."
