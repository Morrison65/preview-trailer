# Claude reviews pull requests from branches of this repository. Fork pull requests are
# skipped: they get no OIDC token and must not reach an authenticated agent anyway.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_federation_rule_id: fdrl_01N8o8BPi2vhp4aUDhXWSu6b
          anthropic_organization_id: c67ab0b8-c617-40b7-8fa7-2baf2b9a7d41
          anthropic_service_account_id: svac_01SLtCsJSZ6RFnbzm5MNvdyW
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first and follow it. Focus on popup/preview detection correctness, regenerated artifacts and signed-URL logging.
            Look for correctness bugs, regressions, security problems and missing tests; ignore style nits and
            generated files. shortkeys.json, Importurl.txt and preview-trailer.bookmarklet.txt are generated by npm run build: never hand-edit them, regenerate in the same change as any preview-trailer.js or lagacy-preview.js edit. Merging to main changes behaviour for real users because the shortkeys fetch the script from main. lagacy-preview.js is frozen. Never log full signed URLs and keep window.open synchronous from the user action. The repository is public: never commit logs, HAR files or media.
            Do not edit files. Post inline comments for concrete problems, then one short summary comment with
            gh pr comment. If you find nothing worth raising, say so in one line.
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh run view:*)"
            --append-system-prompt "You are running in GitHub Actions. The AGENTS.md rules about auto-committing and pushing do not apply here: never push to the default branch, work on a claude/ branch or the PR branch and leave merging to a human. Never print, copy or commit secrets, env file values, signed URLs or HAR files."
